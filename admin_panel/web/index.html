<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Siya Data Admin Panel">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="admin_panel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>admin_panel</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Cache busting and Service Worker cleanup to prevent stale Flutter web scripts -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) { caches.delete(names[i]); }
      });
    }
    (function() {
      var buildVersion = 'v1.0.28_' + Date.now();
      function patchScript(node) {
        if (node && node.tagName === 'SCRIPT' && node.src && node.src.indexOf('main.dart.js') !== -1 && node.src.indexOf('?v=') === -1) {
          node.src = node.src + (node.src.indexOf('?') === -1 ? '?' : '&') + 'v=' + buildVersion;
        }
      }
      var origAppend = document.head.append;
      document.head.append = function() {
        for (var i = 0; i < arguments.length; i++) {
          patchScript(arguments[i]);
        }
        return origAppend.apply(document.head, arguments);
      };
      var origAppendChild = document.head.appendChild;
      document.head.appendChild = function(node) {
        patchScript(node);
        return origAppendChild.call(document.head, node);
      };
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
